<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 💙</title>

<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Patrick Hand',cursive;
    min-height:100vh;
    overflow:hidden;
    background:
    linear-gradient(to bottom,
    #8fdcff 0%,
    #bfe8ff 45%,
    #d8ffd4 100%);
}

.sky{
    position:fixed;
    inset:0;
}

.cloud{
    position:absolute;
    background:white;
    border-radius:100px;
    opacity:.8;
}

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud1{
    width:180px;
    height:60px;
    top:15%;
    left:10%;
}

.cloud1::before{
    width:70px;
    height:70px;
    left:20px;
    top:-30px;
}

.cloud1::after{
    width:90px;
    height:90px;
    right:20px;
    top:-40px;
}

.cloud2{
    width:220px;
    height:70px;
    top:25%;
    right:10%;
}

.cloud2::before{
    width:80px;
    height:80px;
    left:20px;
    top:-30px;
}

.cloud2::after{
    width:100px;
    height:100px;
    right:25px;
    top:-45px;
}

.hero{
    position:relative;
    z-index:2;
    text-align:center;
    padding-top:80px;
}

.hero h1{
    font-size:4rem;
    color:white;
    text-shadow:0 0 20px rgba(255,255,255,.8);
}

.hero p{
    font-size:1.5rem;
    color:#ffffff;
}

.glass-card{
    width:320px;
    margin:30px auto;
    padding:20px;
    border-radius:25px;
    background:rgba(255,255,255,.25);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.5);
    box-shadow:0 8px 30px rgba(0,0,0,.15);
}

button{
    margin-top:15px;
    padding:12px 20px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    background:linear-gradient(
    135deg,
    #a6f0ff,
    #d7c3ff
    );
    font-size:1rem;
}

#message{
    margin-top:15px;
    color:#2a4f63;
    font-size:1.2rem;
}

.grass{
    position:fixed;
    bottom:0;
    width:100%;
    height:120px;
    background:#8ddc6d;
    border-top-left-radius:100% 50px;
    border-top-right-radius:100% 50px;
}

.bubble{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.35);
    border:1px solid rgba(255,255,255,.7);
    backdrop-filter:blur(3px);
    cursor:pointer;
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-150px);
    }
}

.memory-popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:25px;
    border-radius:20px;
    width:300px;
    text-align:center;
    display:none;
    z-index:10;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.memory-popup button{
    margin-top:10px;
}
</style>
</head>
<body>

<div class="sky">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
</div>

<div class="hero">
    <h1>Happy Birthday 💙</h1>

    <div class="glass-card">
        <h2>To [His Name]</h2>

        <p>
            Click the bubbles floating around the sky.
            Each one holds a little surprise :)
        </p>

        <button onclick="birthdayMessage()">
            Open Birthday Letter
        </button>

        <div id="message"></div>
    </div>
</div>

<div class="grass"></div>

<div class="memory-popup" id="popup">
    <h2>💌 Memory</h2>
    <p id="popupText"></p>
    <button onclick="closePopup()">Close</button>
</div>

<script>
const memories = [
"One of my favorite things is getting to talk to you.",
"You always know how to make me smile.",
"Thank you for being you.",
"I hope this year brings you everything you deserve.",
"You make ordinary days feel special.",
"You mean a lot to me 💙",
"Happy Birthday!! 🎂"
];

function birthdayMessage(){
    document.getElementById("message").innerHTML =
    "I made this little website because you're important to me. Happy Birthday 💙";
}

function createBubble(){
    const bubble = document.createElement("div");

    bubble.classList.add("bubble");

    const size = Math.random()*60+40;

    bubble.style.width = size + "px";
    bubble.style.height = size + "px";

    bubble.style.left = Math.random()*100 + "%";

    bubble.style.animationDuration =
    (Math.random()*10+10) + "s";

    bubble.addEventListener("click", () => {
        document.getElementById("popup").style.display="block";

        document.getElementById("popupText").innerText =
        memories[Math.floor(Math.random()*memories.length)];

        bubble.remove();
    });

    document.body.appendChild(bubble);

    setTimeout(()=>{
        bubble.remove();
    },20000);
}

function closePopup(){
    document.getElementById("popup").style.display="none";
}

setInterval(createBubble,1200);
</script>

</body>
</html>
