<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memories 💙</title>

<style>
body{
    margin:0;
    min-height:100vh;

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
        180deg,
        #89d8ff,
        #c9eeff,
        #d7ffd8
    );

    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:80%;
    max-width:600px;

    background:rgba(255,255,255,.3);

    backdrop-filter:blur(10px);

    padding:30px;

    border-radius:25px;

    color:white;

    text-align:center;
}

.memory{
    background:rgba(255,255,255,.25);

    margin:15px 0;

    padding:15px;

    border-radius:15px;
}
</style>
</head>

<body>

<div class="card">

<h1>Our Memories 💙</h1>

<div class="memory">
First Roblox game together 🎮
</div>

<div class="memory">
That time we stayed up talking forever 🌙
</div>

<div class="memory">
The day I realized you were special :)
</div>

</div>

</body>
</html>
